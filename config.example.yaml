# XiaoAi-LLM-Router 配置模板
# 用法: cp config.example.yaml config.yaml，然后填写。
# 敏感字段（*_KEY / password）建议走 .env / 环境变量，不要提交进 git。

# ---------- 小米账号（MiService 同款，用于设备绑定） ----------
mi:
  username: "your_mi_account"
  password: "your_mi_password"          # 建议改用环境变量 MI_PASSWORD
  device_id: "1A2B3C4D-EFFF-0000-XXXX" # 单设备（MiService 控制台可查）
  # 多台音箱监听时改成列表:
  # devices:
  #   - "1A2B3C4D-EFFF-0000-XXXX"
  #   - "5E6F7G8H-IIJJ-1111-YYYY"

# ---------- MiService 收音源 ----------
# v1.1：默认走 MQTT Bridge（延迟 <1s，MiService 官方集成方式）；
#       连不上自动回落 HTTP 轮询（talks_path 因版本而异，连不通就先跑通 mqtt）。
miservice:
  base_url: "http://localhost:8080"    # HTTP API（轮询兜底 / TTS 回放都用它）
  ingest: "conversation"                # conversation | poll | auto
                                          # conversation = MiService 库拦截小爱问答（机型无关，推荐）
                                          # poll = HTTP 轮询 MiService talks 接口（兜底）
                                          # auto = 先 conversation，挂了落 poll
  mqtt_host: "127.0.0.1"               # 容器部署时改成 miservice 所在主机
  mqtt_port: 1883
  mqtt_topic: "miservice/bridge/{device_id}"
  # mqtt_user: ""                       # broker 要密码时填
  # mqtt_password: ""
  talks_path: "/api/v1/talks"          # 轮询模式的对话记录路径（按你的 MiService 版本核对）
  tts_path: "/api/v1/tts"              # TTS 回放路径
  poll_interval: 2                      # 轮询间隔（秒），失败指数退避

# ---------- 大模型路由 ----------
llm:
  default_provider: "deepseek"         # 可选: deepseek | ollama | openai（LiteLLM 支持的均可）
  stream: true                         # 边想边说：每攒够一个短句立即 TTS（推荐开）
  # timeout_seconds: 60                # 全局超时；Ollama 冷启动建议 120+
  deepseek:
    api_key: "sk-xxxxxxxxxxxxxxxx"      # 或环境变量 DEEPSEEK_API_KEY
    model: "deepseek-chat"
  ollama:
    base_url: "http://host.docker.internal:11434"  # 容器内访问宿主机 Ollama
    model: "qwen2.5:7b"
  openai:
    api_key: "sk-xxxxxxxxxxxxxxxx"     # 或环境变量 OPENAI_API_KEY
    model: "gpt-4o-mini"

# ---------- 多轮对话记忆 ----------
session:
  ttl_seconds: 600                     # 同一设备超过 10 分钟没说话，记忆清零
  max_turns: 10                        # 滑动窗口保留最近 10 轮（v1.1 起语义正确）

# ---------- 触发器（唤醒词） ----------
# ⚠️ 不要用 "请问"：它出现在小爱 99% 的指令里（"请问今天天气"），
#    命中即抢答，网关会变成复读机。选低频无歧义的词。
trigger:
  wake_words:
    - "问问 AI"                        # 口语自然，几乎不会误触发
    - "深思"
  # 二次开发钩子：给某条唤醒词绑专属 system prompt（字典形态）:
  #   - word: "深思"
  #     prefix: "你正在深思模式，请先给出推理步骤再给结论。"

# ---------- TTS 回放 ----------
tts:
  engine: "mi_tts"                     # 让被绑定音箱念出来（走 MiService tts_path）
  max_chunk_chars: 60                  # 长回复切成 <=60 字的小句，逐句播
# ---------- MiService 库登录（ingest: conversation 时必填） ----------
# device_list / get_latest_ask / text_to_speech 都靠它登录小米云
# serviceToken 首次登录落 ~/.mi.token，之后免密复用（同机重跑不重新 OTP）
